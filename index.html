<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The One Super Cup Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .tab-btn { transition: all 0.3s; color: white; }
        .active-tab { background-color: white !important; color: #003399 !important; font-weight: 800; }
        .neon-btn {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: #003399; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px #00d4ff, 0 0 30px #003399; z-index: 1000; cursor: pointer;
            border: 2px solid #00d4ff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-[#003399] border-b-4 border-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-3 py-4 flex flex-col gap-3">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1 rounded-lg h-9 w-9 overflow-hidden flex items-center justify-center">
                    <img src="https://upload.wikimedia.org/wikipedia/en/thumb/0/0b/UEFA_Super_Cup_logo.svg/960px-UEFA_Super_Cup_logo.svg.png" alt="Logo" class="h-full w-full object-contain">
                </div>
                <div>
                    <h1 class="text-sm font-black text-white">THE ONE <span class="text-white">SUPER CUP</span></h1>
                    <p class="text-[8px] text-blue-200 font-bold uppercase tracking-widest">Season - 3</p>
                </div>
            </div>
            
            <div class="grid grid-cols-5 gap-1 bg-blue-900 p-1 rounded-lg">
                <button onclick="showStage('playoff')" id="tab-playoff" class="tab-btn py-2 text-[9px] font-bold rounded-md">PLAY-OFF</button>
                <button onclick="showStage('r16')" id="tab-r16" class="tab-btn py-2 text-[9px] font-bold rounded-md">R-16</button>
                <button onclick="showStage('qf')" id="tab-qf" class="tab-btn py-2 text-[9px] font-bold rounded-md">QF</button>
                <button onclick="showStage('sf')" id="tab-sf" class="tab-btn py-2 text-[9px] font-bold rounded-md">SF</button>
                <button onclick="showStage('final')" id="tab-final" class="tab-btn py-2 text-[9px] font-bold rounded-md">FINAL</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 py-5 flex-1 w-full">
        <div id="content-container" class="space-y-4"></div>
    </main>

    <a href="https://supercupknockout.ziokai2212006.workers.dev/" id="drag-btn" class="neon-btn">
        <i class="fas fa-trophy text-white text-xl"></i>
    </a>

    <script>
        const TEAMS = [
            { id: "LIV", name: "Liverpool", logo: "https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg", tg: "https://t.me/Nikakmt" },
            { id: "TOT", name: "Tottenham", logo: "https://upload.wikimedia.org/wikipedia/en/b/b4/Tottenham_Hotspur.svg", tg: "https://t.me/Pyaephyokyaw255" },
            { id: "CHE", name: "Chelsea", logo: "https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg", tg: "https://t.me/aungnayzan" },
            { id: "ARS", name: "Arsenal", logo: "https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg", tg: "https://t.me/kenzjust" },
            { id: "BAR", name: "Barcelona", logo: "https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg", tg: "https://t.me/lokidemon99" },
            { id: "RMA", name: "Real Madrid", logo: "https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg", tg: "https://t.me/Skino777" },
            { id: "ATM", name: "Atletico", logo: "https://upload.wikimedia.org/wikipedia/en/f/f4/Atletico_Madrid_2017_logo.svg", tg: "https://t.me/" },
            { id: "SEV", name: "Sevilla", logo: "https://upload.wikimedia.org/wikipedia/en/3/3b/Sevilla_FC_logo.svg", tg: "https://t.me/Arkar370" },
            { id: "FIO", name: "Fiorentina", logo: "https://upload.wikimedia.org/wikipedia/en/b/ba/ACF_Fiorentina_2022_logo.svg", tg: "https://t.me/HeinHtet_Nai" },
            { id: "NAP", name: "Napoli", logo: "https://upload.wikimedia.org/wikipedia/commons/2/2d/SSC_Napoli.svg", tg: "https://t.me/MRTONE3" },
            { id: "MIL", name: "AC Milan", logo: "https://upload.wikimedia.org/wikipedia/commons/d/d0/Logo_of_AC_Milan.svg", tg: "https://t.me/Sanminoo" },
            { id: "INT", name: "Inter Milan", logo: "https://upload.wikimedia.org/wikipedia/commons/0/05/FC_Internazionale_Milano_2021.svg", tg: "https://t.me/Zayyarlin2" },
            { id: "RBL", name: "RB Leipzig", logo: "https://upload.wikimedia.org/wikipedia/en/0/04/RB_Leipzig_2014_logo.svg", tg: "https://t.me/Myan_Khun" },
            { id: "DOR", name: "Dortmund", logo: "https://upload.wikimedia.org/wikipedia/commons/6/67/Borussia_Dortmund_logo.svg", tg: "https://t.me/KoKyaw_KYT" },
            { id: "UNI", name: "Union Berlin", logo: "https://upload.wikimedia.org/wikipedia/en/5/5e/1._FC_Union_Berlin_logo.svg", tg: "https://t.me/merrydesu" },
            { id: "LEV", name: "Leverkusen", logo: "https://upload.wikimedia.org/wikipedia/de/f/f7/Bayer_Leverkusen_Logo.svg", tg: "https://t.me/mikeyjn" },
            { id: "MUN", name: "Man United", logo: "https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg", tg: "https://t.me/Nyan428925" },
            { id: "LEE", name: "Leeds", logo: "https://upload.wikimedia.org/wikipedia/en/5/54/Leeds_United_logo.svg", tg: "https://t.me/ptkyaw87" },
            { id: "SOC", name: "Real Sociedad", logo: "https://upload.wikimedia.org/wikipedia/en/f/f1/Real_Sociedad_logo.svg", tg: "https://t.me/JeevaG2006" },
            { id: "VIL", name: "Villarreal", logo: "https://upload.wikimedia.org/wikipedia/en/7/70/Villarreal_CF_logo.svg", tg: "https://t.me/LuNyo0" },
            { id: "PAR", name: "Parma", logo: "https://upload.wikimedia.org/wikipedia/en/9/9e/Parma_Calcio_1913_logo.svg", tg: "https://t.me/iz_szlai" },
            { id: "ROM", name: "Roma", logo: "https://upload.wikimedia.org/wikipedia/en/f/f7/AS_Roma_logo_%282017%29.svg", tg: "https://t.me/KyawGyi798260" },
            { id: "WOL", name: "Wolfsburg", logo: "https://upload.wikimedia.org/wikipedia/en/f/f3/VfL_Wolfsburg_logo.svg", tg: "https://t.me/Badrul11" },
            { id: "STP", name: "Saint Pauli", logo: "https://upload.wikimedia.org/wikipedia/en/d/d4/FC_St._Pauli_logo.svg", tg: "https://t.me/kharkhar1225" }
        ];

        const MATCHES = {
            playoff: [
                { home: 'LIV', hs: 5, away: 'LEV', as: 6 },
                { home: 'TOT', hs: 1, away: 'UNI', as: 2 },
                { home: 'CHE', hs: 9, away: 'DOR', as: 4 },
                { home: 'ARS', hs: 3, away: 'RBL', as: 0 },
                { home: 'BAR', hs: 9, away: 'INT', as: 13 },
                { home: 'RMA', hs: 1, away: 'MIL', as: 6 },
                { home: 'ATM', hs: 1, away: 'NAP', as: 0 },
                { home: 'SEV', hs: 6, away: 'FIO', as: 9 }
            ],
            r16: [
                { home: 'LEV', hs: 5, away: 'MUN', as: 8 },
                { home: 'CHE', hs: 3, away: 'LEE', as: 4 },
                { home: 'ARS', hs: 0, away: 'SOC', as: 0 },
                { home: 'INT', hs: 1, away: 'VIL', as: 6 },
                { home: 'MIL', hs: 6, away: 'PAR', as: 5 },
                { home: 'ATM', hs: 0, away: 'ROM', as: 0 },
                { home: 'FIO', hs: 8, away: 'WOL', as: 1 },
                { home: 'STP', hs: 2, away: 'UNI', as: 8 }
            ],
            qf: [
                { home: 'MUN', hs: 4, away: 'LEE', as: 2 },
                { home: 'SOC', hs: 2, away: 'VIL', as: 5 },
                { home: 'MIL', hs: 3, away: 'ATM', as: 1 },
                { home: 'FIO', hs: 4, away: 'UNI', as: 1 }
            ],
            sf: [
                { home: 'MUN', away: 'VIL' },
                { home: 'MIL', away: 'FIO' }
            ],
            final: Array(1).fill({ home: 'TBD', away: 'TBD' })
        };

        function showStage(stage) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active-tab'));
            document.getElementById(`tab-${stage}`).classList.add('active-tab');
            const container = document.getElementById('content-container');
            container.innerHTML = `<h2 class="text-center font-black text-[#003399] uppercase py-2">${stage.replace('-', ' ')} stage</h2>`;
            
            MATCHES[stage].forEach((match) => {
                const h = TEAMS.find(t => t.id === match.home) || {name: "TBD", logo: "https://placehold.co/40x40/ddd/555?text=?", tg: "#"};
                const a = TEAMS.find(t => t.id === match.away) || {name: "TBD", logo: "https://placehold.co/40x40/ddd/555?text=?", tg: "#"};
                const scoreDisplay = (match.hs !== undefined) ? `${match.hs} - ${match.as}` : "VS";
                
                container.innerHTML += `
                    <div class="bg-white border border-slate-100 rounded-xl p-3 flex items-center justify-between shadow-sm">
                        <a href="${h.tg}" target="_blank" class="flex items-center gap-2 w-[40%]"><img src="${h.logo}" class="w-8 h-8 object-contain"><span class="text-xs font-bold truncate">${h.name}</span></a>
                        <div class="text-[#003399] font-black text-xs">${scoreDisplay}</div>
                        <a href="${a.tg}" target="_blank" class="flex items-center gap-2 w-[40%] justify-end"><span class="text-xs font-bold truncate">${a.name}</span><img src="${a.logo}" class="w-8 h-8 object-contain"></a>
                    </div>
                `;
            });
        }
        window.onload = () => showStage('qf');
    </script>
</body>
</html>
